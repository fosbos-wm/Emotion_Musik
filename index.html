<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141519;
    --surface: #1e1f26;
    --text: #f4f2ef;
    --muted: #9d9ca8;
    --accent: #5B8CFF;
    --display: 'Unbounded', system-ui, sans-serif;
    --body: 'Figtree', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; cursor: none; }

  .backdrop { position: fixed; inset: -15%; background-size: cover; background-position: center;
    filter: blur(90px) saturate(1.5); opacity: .22; transition: background-image 1s ease; }
  .glow { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(55% 70% at 22% 64%, color-mix(in srgb, var(--accent) 28%, transparent) 0%, transparent 70%); }

  .stage { position: relative; height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
    gap: 2.5vh; padding: 3.5vh 4vw 3vh; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 2.2vh; }
  .wordmark { font-family: var(--display); font-weight: 700; font-size: 3.6vh; letter-spacing: -.02em; }
  .schoollogo { height: 4vh; width: auto; opacity: .7; }
  .timer { width: 18vh; height: .5vh; background: rgba(255,255,255,.12); border-radius: 1vh; overflow: hidden; }
  .timer-bar { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  .timer-bar.run { animation: fill var(--dur, 15s) linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  .main { display: grid; grid-template-rows: auto 1fr; gap: 3vh; min-height: 0;
    transition: opacity .5s ease, transform .5s ease; }
  .main.out { opacity: 0; transform: translateY(1.2vh); }

  .cat-name { font-family: var(--display); font-weight: 800; font-size: 12vh; line-height: .95;
    letter-spacing: -.035em; color: var(--accent); }
  .cat-line { font-size: 3.2vh; opacity: .82; margin-top: 1.4vh; }

  .board { display: flex; gap: 2.4vh; align-items: flex-end; min-height: 0; }

  .tile { position: relative; aspect-ratio: 1; border-radius: 1.6vh; overflow: hidden; background: var(--surface); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { position: absolute; inset: auto 0 0 0; padding: 4vh 1.8vh 1.6vh; display: flex; flex-direction: column; gap: .4vh;
    background: linear-gradient(transparent, rgba(10,10,12,.9)); }
  .cap .t { font-weight: 600; font-size: 2.2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .n { font-size: 1.8vh; color: #d9d8de; }

  .hero { height: 52vh; flex: none; animation: breathe 5s ease-in-out infinite;
    box-shadow: 0 0 0 .4vh var(--accent), 0 3vh 8vh -2vh color-mix(in srgb, var(--accent) 55%, transparent); }
  .hero .cap { padding: 9vh 3vh 2.6vh; }
  .hero .cap .t { font-family: var(--display); font-weight: 700; font-size: 3.6vh; line-height: 1.12; white-space: normal;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hero .cap .n { font-size: 2.4vh; }
  @keyframes breathe {
    50% { transform: scale(1.012);
      box-shadow: 0 0 0 .4vh var(--accent), 0 4vh 11vh -1vh color-mix(in srgb, var(--accent) 70%, transparent); }
  }

  .song-qr { position: absolute; top: 2vh; right: 2vh; background: #fff; color: #141519; border-radius: 1.2vh;
    padding: 1vh 1vh .7vh; display: flex; flex-direction: column; align-items: center; gap: .5vh;
    font-size: 1.5vh; font-weight: 600; box-shadow: 0 1vh 3vh rgba(0,0,0,.35); }
  .song-qr-code { width: 13vh; }
  .song-qr-code img, .song-qr-code canvas { display: block; width: 100% !important; height: auto !important; }

  #heroSlot { transition: opacity .35s ease; }
  #heroSlot.out { opacity: 0; }
  .smalls .tile { transition: box-shadow .35s ease; }
  .smalls .tile.active { box-shadow: 0 0 0 .4vh var(--accent); }

  .smalls { display: grid; grid-template-columns: repeat(2, 25vh); grid-template-rows: repeat(2, 25vh); gap: 2vh; flex: none; }

  .empty { background: transparent; border: .3vh dashed color-mix(in srgb, var(--accent) 55%, transparent);
    display: grid; place-items: center; text-align: center; padding: 2vh; color: var(--muted); font-size: 1.9vh; }
  .hero.empty { animation: none; box-shadow: none; padding: 6vh; font-size: 2.9vh; line-height: 1.4; }

  .join { margin-left: auto; width: 34vh; display: flex; flex-direction: column; gap: 1.6vh; }
  .qr { background: #fff; padding: 1.6vh; border-radius: 1.6vh; width: 26vh; }
  .qr img, .qr canvas { display: block; width: 100% !important; height: auto !important; }
  .join-title { font-family: var(--display); font-weight: 700; font-size: 2.6vh; line-height: 1.2; }
  .join-text { font-size: 2vh; color: var(--muted); line-height: 1.4; }

  .strip { display: flex; gap: 4.5vh; font-family: var(--display); font-weight: 500; font-size: 2.1vh; color: var(--muted); }
  .strip span { display: flex; align-items: center; gap: 1vh; padding-bottom: .8vh;
    border-bottom: .35vh solid transparent; transition: color .4s, border-color .4s; }
  .strip i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: var(--c); }
  .strip .on { color: var(--text); border-color: var(--c); }

  .notice { position: fixed; left: 50%; bottom: 10vh; transform: translateX(-50%); max-width: 80vw;
    background: #2a1a1d; border: .2vh solid #ff4d5e; color: var(--text); padding: 2vh 3vh; border-radius: 1.4vh;
    font-size: 2.2vh; line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; }
    .main, #heroSlot { transition: none; }
    .timer-bar.run { animation: none; transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="glow"></div>

  <div class="stage">
    <header class="top">
      <div class="brand">
        <span class="wordmark">switch</span>
        <img class="schoollogo" src="logo-fosbos-hell.png" alt="FOSBOS Weilheim" onerror="this.remove()">
      </div>
      <div class="timer" aria-hidden="true"><div class="timer-bar" id="timerBar"></div></div>
    </header>

    <main class="main" id="main">
      <section>
        <h1 class="cat-name" id="catName"></h1>
        <p class="cat-line" id="catLine"></p>
      </section>
      <div class="board">
        <div id="heroSlot"></div>
        <div class="smalls" id="smalls"></div>
        <aside class="join">
          <div class="qr" id="qr"></div>
          <p class="join-title">Deinen Song teilen?</p>
          <p class="join-text">Diesen Code scannen, Spotify-Link einfügen, fertig. Ohne Anmeldung.</p>
        </aside>
      </div>
    </main>

    <nav class="strip" id="strip" aria-label="Kategorien"></nav>
  </div>

  <div class="notice" id="notice" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig, CATEGORIES, SONG_SECONDS, SLOTS_PER_CATEGORY, isConfigured } from "./config.js";

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const submitUrl = new URL("einreichen.html", location.href).href;

    let byCat = Object.fromEntries(CATEGORIES.map(c => [c.id, []]));
    let index = 0;          // aktuelle Kategorie
    let spot = 0;           // welcher Song der Kategorie gerade groß gezeigt wird
    let rotationTimer = null;
    let firstLoad = true;

    // Kategorie-Streifen unten
    $("strip").innerHTML = CATEGORIES.map(c =>
      `<span data-id="${c.id}" style="--c:${c.color}"><i></i>${esc(c.name)}</span>`).join("");

    // QR-Code (führt direkt zur gerade gezeigten Kategorie)
    const qr = window.QRCode
      ? new QRCode($("qr"), { text: submitUrl, width: 512, height: 512,
          colorDark: "#141519", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M })
      : null;
    if (!qr) $("qr").textContent = submitUrl;

    function showNotice(text) { $("notice").textContent = text; $("notice").hidden = false; }

    function tileHTML(song, extraClass) {
      return `<div class="tile ${extraClass}">
        <img src="${esc(song.cover)}" alt="">
        ${extraClass === "hero" ? `<div class="song-qr"><div class="song-qr-code" id="heroQr"></div><span>Scannen und anhören</span></div>` : ""}
        <div class="cap"><span class="t">${esc(song.title)}</span><span class="n">von ${esc(song.nickname)}</span></div>
      </div>`;
    }

    const currentSongs = () => byCat[CATEGORIES[index].id] || [];

    function renderHero() {
      const cat = CATEGORIES[index];
      const songs = currentSongs();
      if (spot >= songs.length) spot = 0;
      const song = songs[spot];

      $("heroSlot").innerHTML = song
        ? tileHTML(song, "hero")
        : `<div class="tile hero empty">Noch kein Song für ${esc(cat.name)}. Scann den Code und teil den ersten.</div>`;
      if (song && window.QRCode) {
        new QRCode($("heroQr"), { text: song.url, width: 256, height: 256,
          colorDark: "#141519", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      }
      $("backdrop").style.backgroundImage = song ? `url(${JSON.stringify(song.cover)})` : "none";

      // Der gerade groß gezeigte Song wird auch in der kleinen Reihe markiert
      document.querySelectorAll("#smalls .tile").forEach((el, i) => el.classList.toggle("active", i === spot - 1));
    }

    function renderCategory() {
      const cat = CATEGORIES[index];
      document.documentElement.style.setProperty("--accent", cat.color);
      $("catName").textContent = cat.name;
      $("catLine").textContent = cat.line;

      // Kleine Kacheln: Songs 2 bis 5 in fester Reihenfolge (neueste zuerst)
      const rest = currentSongs().slice(1);
      let smalls = "";
      for (let i = 0; i < SLOTS_PER_CATEGORY - 1; i++) {
        smalls += rest[i] ? tileHTML(rest[i], "") : `<div class="tile empty">Platz frei</div>`;
      }
      $("smalls").innerHTML = smalls;

      document.querySelectorAll("#strip span").forEach(el => el.classList.toggle("on", el.dataset.id === cat.id));
      if (qr) qr.makeCode(`${submitUrl}?k=${cat.id}`);
      renderHero();
    }

    function swapHero() {
      if (reducedMotion) { renderHero(); return; }
      $("heroSlot").classList.add("out");
      setTimeout(() => { renderHero(); $("heroSlot").classList.remove("out"); }, 350);
    }

    // Alle SONG_SECONDS: nächster Song der Kategorie, nach dem letzten die nächste Kategorie
    function schedule() {
      clearTimeout(rotationTimer);
      rotationTimer = setTimeout(step, SONG_SECONDS * 1000);
    }

    function step() {
      if (spot + 1 < currentSongs().length) {
        spot++;
        swapHero();
        schedule();
      } else {
        show((index + 1) % CATEGORIES.length);
      }
    }

    // Fortschrittsbalken oben rechts läuft über die ganze Kategorie
    function startBar() {
      const seconds = Math.max(1, currentSongs().length) * SONG_SECONDS;
      const bar = $("timerBar");
      bar.style.setProperty("--dur", `${seconds}s`);
      bar.classList.remove("run");
      void bar.offsetWidth;
      bar.classList.add("run");
    }

    function show(i, animate = true) {
      index = i;
      spot = 0;
      const main = $("main");
      if (animate && !reducedMotion) {
        main.classList.add("out");
        setTimeout(() => { renderCategory(); main.classList.remove("out"); }, 500);
      } else {
        renderCategory();
      }
      startBar();
      schedule();
    }

    if (!isConfigured()) {
      show(0, false);
      showNotice("Firebase ist noch nicht eingerichtet: Trag deine Projektdaten in config.js ein.");
    } else {
      const db = getFirestore(initializeApp(firebaseConfig));
      const q = query(collection(db, "songs"), orderBy("createdAt", "desc"), limit(500));

      onSnapshot(q, snap => {
        $("notice").hidden = true;
        const groups = Object.fromEntries(CATEGORIES.map(c => [c.id, []]));
        snap.forEach(doc => {
          const s = doc.data();
          if (groups[s.category] && groups[s.category].length < SLOTS_PER_CATEGORY) groups[s.category].push(s);
        });
        byCat = groups;

        if (firstLoad) { firstLoad = false; show(0, false); return; }

        // Neuer Song? Direkt zu seiner Kategorie springen, damit man ihn sofort sieht.
        const added = snap.docChanges().find(ch => ch.type === "added");
        const target = added ? CATEGORIES.findIndex(c => c.id === added.doc.data().category) : -1;
        if (target >= 0) show(target, true);
        else renderCategory();
      }, err => {
        console.error(err);
        const reasons = {
          "permission-denied": "Die Firestore-Regeln erlauben das Lesen nicht. Regeln aus firestore.rules in der Firebase-Konsole unter Firestore Database → Regeln einfügen und veröffentlichen.",
          "not-found": "Es gibt keine Firestore-Datenbank mit dem Namen (default). In der Firebase-Konsole unter Firestore Database eine Datenbank anlegen.",
          "failed-precondition": "Firestore ist für dieses Projekt noch nicht eingerichtet oder läuft im falschen Modus.",
          "unavailable": "Firebase ist nicht erreichbar. Möglicherweise blockiert das Netzwerk oder ein Werbeblocker die Verbindung."
        };
        showNotice(`Keine Verbindung zur Datenbank (${err.code}). ${reasons[err.code] || err.message}`);
        if (firstLoad) { firstLoad = false; show(0, false); }
      });
    }

    // Sicherheitsnetz für den Dauerbetrieb: alle 6 Stunden neu laden
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  </script>
</body>
</html>
